<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <filter id="plaster" x="0%" y="0%" width="100%" height="100%">
    <!-- Generate fractal noise for organic plaster/chalk texture -->
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise"/>
    <!-- Apply diffuse lighting to give 3D embossment / tactile shading -->
    <feDiffuseLighting in="noise" lighting-color="#f5f2eb" surfaceScale="2.5" result="light">
      <feDistantLight azimuth="135" elevation="55"/>
    </feDiffuseLighting>
    <!-- Multiply the light with Chalk Sand color to create the organic mineral background -->
    <feBlend mode="multiply" in="SourceGraphic" in2="light"/>
  </filter>
  <rect width="100%" height="100%" fill="#f7f5f0" filter="url(#plaster)"/>
</svg>
